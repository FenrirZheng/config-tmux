# tmux copy-mode 複製時送到系統剪貼簿
set -g set-clipboard on

# 加大 scrollback history
set -g history-limit 100000

# 開啟滑鼠：滾輪在一般 pane 自動進 copy-mode；在全螢幕 TUI（claude / vim / less）
# 則把滾輪事件轉發給 app，讓它捲自己的內部歷史（替代畫面無 tmux scrollback）。
# 代價：拖選會進 tmux 選取，要用終端原生選取/貼上請按住 Shift 拖曳。
set -g mouse on

# Prefix: Ctrl-b (tmux default).
# Press C-b twice to send a literal C-b to the inner program.
unbind C-a
set -g prefix C-b
bind C-b send-prefix

# prefix + C-t used to be a second copy-mode entry. Removed 2026-08-20: it
# duplicated `prefix [' (tmux's own, still bound) and `prefix Space' (seek,
# claude.conf) with nothing of its own. `unbind' rather than a plain deletion,
# because `source-file' does NOT remove a stale binding from a running server
# (measured -- see runbooks/seek.md, "source-file does not unbind").
unbind C-t

#     pop up window  open bind
bind P display-popup -d "#{pane_current_path}" -w 90% -h 90% -E

# prefix + ? : curated cheat sheet in a popup — the tmux-layer answer to
# Emacs' which-key.  `prefix + ?' is tmux's default `list-keys -N', which dumps
# ~200 bindings: complete, unreadable, and never what you actually forgot.  The
# curated ~15 lines live in ~/.tmux/cheat.txt (tracked next to this file); the
# full dump moves to `prefix + M-?' and is advertised inside the sheet.
# `less' (not `cat') so the popup stays up until `q' and can scroll.
# Part of the cross-tool keybinding policy — see the sheet's own footer and
# ~/.emacs.d/lisp/init-keys.el for the Emacs half.
#
# Sized in ABSOLUTE cells, not percentages, because cheat.txt is fixed-column
# layout: a percentage on a narrow client wraps the columns into mush. The
# numbers are the sheet's own measurements plus the chrome around it —
# 62 lines + 1 `less' status row + 2 border rows = 65, and 81 cells wide + 2
# border cols = 83, rounded up for slack on the width. Raised from 78x34 on
# 2026-08-28, which fit neither: it paged 27 of the then-59 lines and wrapped 5
# cells off the right edge. The two copy-mode scroll rows took the count to 62
# on 2026-09-11 (60 since the `prefix g' row of 2026-09-03), so the HEIGHT
# still has zero slack — the next row added must raise -h to 66. If you add
# rows or widen a column in cheat.txt, re-measure and raise these — the sheet
# is supposed to be readable in one screenful.
bind ? display-popup -w 85 -h 65 -E "less -R ~/.tmux/cheat.txt"
bind M-? list-keys -N

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Theme: catppuccin mocha (picked by live try-on 2026-08-24 — records/2026-08-23-2241-tmux-ui-clarity/).
# Theme OPTION lines must sit ABOVE the `run tpm` line: run-shell fires before
# later lines parse, so options set below it are invisible to plugin entry
# scripts at TPM load (measured on dracula during the try-on; same mechanism
# as the tokyo-night transparent bake — see the effort's kb).
set -g @catppuccin_flavor "mocha"
# Bar polish 2026-10-23 (records/2026-10-23-tmux-bar-polish/): flat blocks.
# Rounded capsules were tried the same day and rejected (user: 「膠囊形狀很醜」).
# Tabs are "basic" (square number + title cells); each module is a square icon
# cell + text cell, padded with solid █ in the cell's own color, no curves.
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█ "
# Tab text: Claude Code's own "✳ " title prefix stripped (the state glyph says
# the same thing better), then cc-beacon's state glyph INSIDE the tab block.
# @claude_tab_glyph is published by `cc-beacon install-bar` (claude.conf) and
# starts with a space; the window right separator adds the one after it.
# The #{E:} re-expands it on every refresh.
# Palette + tab text (round four): owned by
# records/2026-10-23-tmux-bar-polish/try-palette.sh — edit there, not here.
# Every option is set explicitly: catppuccin fills module icon colors with
# `set -o`, so a dropped line would leave the previous variant's value live.
# >>> palette
set -g @bar_hide_numeric_session 0
set -g @catppuccin_session_color "#{?client_prefix,#cba6f7,#585b70}"
set -g @catppuccin_gitmux_color "#585b70"
set -g @catppuccin_directory_color "#585b70"
set -g @catppuccin_status_session_icon_bg "#{?client_prefix,#cba6f7,#585b70}"
set -g @catppuccin_status_gitmux_icon_bg "#585b70"
set -g @catppuccin_status_directory_icon_bg "#585b70"
set -g @catppuccin_status_session_icon_fg "#{?client_prefix,#11111b,#cdd6f4}"
set -g @catppuccin_status_gitmux_icon_fg "#cdd6f4"
set -g @catppuccin_status_directory_icon_fg "#cdd6f4"
set -g @catppuccin_status_module_text_bg "#313244"
set -g @catppuccin_window_number ""
set -g @catppuccin_window_number_color "#313244"
set -g @catppuccin_window_text_color "#313244"
set -g @catppuccin_window_current_text_color "#45475a"
set -g @catppuccin_window_text "#[fg=#9399b2]#I#[fg=#cdd6f4] #{=/20/…:#{s|^✳ ||:pane_title}}#{E:@claude_tab_glyph}"
set -g @catppuccin_window_current_text " #{=/20/…:#{s|^✳ ||:pane_title}}#{E:@claude_tab_glyph}"
# <<< palette
# (=/20/… caps a title at 20 cells so a long one cannot push the tab row into
# the right-hand modules.)
# catppuccin fills the CURRENT tab's separators with `set -o` — only if unset —
# so a running server keeps whatever an earlier style left there (the current
# tab kept the old style's shape after a style switch). Unset them so every reload
# re-derives them from the style above.
set -gu @catppuccin_window_current_left_separator
set -gu @catppuccin_window_current_middle_separator
set -gu @catppuccin_window_current_right_separator
# "no": each module closes onto the bar background, so its end █ and the gap
# after it are drawn instead of blending into the previous module.
set -g @catppuccin_status_connect_separator "no"
# Bar background: "default" = opaque mantle #181825, "none" = Alacritty's 0.95
# translucency shows through, like the panes.
set -g @catppuccin_status_background "default"
# Directory module: ~-relative full path (default is basename only).
set -g @catppuccin_directory_text " #{s|/home/fenrir|~|:pane_current_path}"

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


# prefix Space (seek: search, jump, grab) lives in claude.conf with the rest of
# the tool bindings — it replaced the hint-picker plugin here 2026-08-09.
# prefix / (its regex sibling) lives there too: a status-line prompt from
# 2026-08-22, a popup running the `sift` binary since 2026-08-27.
# Removal rationale and rollback: runbooks/seek.md, runbooks/sift.md; design:
# records/2026-08-09-1116-tmux-seek/, records/2026-08-27-2240-tmux-sift/.

# seek's four output keys bind in the copy-mode (emacs) table and its search
# prompt matches the stock emacs C-r bindings. Pinned so a change of EDITOR/
# VISUAL (which tmux consults for the default) cannot silently move the keys
# into the copy-mode-vi table where nothing is bound.
set -g mode-keys emacs
set -g status-keys emacs


# tmux ace-window , fenrir design : emacs ace-window for tmux panes
# prefix + o : jump to a pane ; prefix + O : swap with a pane. Options + docs:
# ~/.tmux/plugins/tmux-ace-window/README.md
# (This comment said a / A until 2026-07-30; the plugin's actual defaults are
#  @ace-window-key = o and @ace-window-swap-key = O -- verified with
#  `tmux list-keys -T prefix'.  Set those options before the run-shell below if
#  you want a / A back.)
# 標籤底色用 default（tmux 預設背景），讓色塊融入 pane border，只留粗體字母。
# 選項必須設在 run-shell 之前。
set -g @ace-window-label-bg 'default'
run-shell ~/.tmux/plugins/tmux-ace-window/ace-window.tmux

# prefix + g : jump to a pane by TITLE — bound in claude.conf (pane-jump,
# tools/). Was an inline command-prompt + choose-tree here until 2026-09-03.


# 解決 Escape 鍵延遲（Evil 模式必看）：
# 如果你在 Emacs 裡使用 Vim 鍵盤布局（Evil-mode），你會發現按 Esc 退出插入模式時有明顯的延遲。這是因為 tmux 在等待判斷這是不是一個組合鍵。請在 .tmux.conf 中將延遲調
set -s escape-time 10

# 註：舊版用 `setw -g xterm-keys on` 解開 Shift/Ctrl + 方向鍵，但該選項在
# tmux 3.2 已移除，tmux 現在一律視同開啟，無需再設（移除於 2026-05-20）。


# default-terminal 設定的是 tmux 窗格「內部」回報的 TERM，與外層終端機無關，固定用 tmux-256color。
set -g default-terminal "tmux-256color"


# 啟用外層終端機的真色彩（24-bit RGB）支援。
# 冒號前是外層終端的 TERM：Alacritty 自帶 terminfo，TERM=alacritty（不是 xterm-256color）；
# 寫錯名稱會讓 RGB 掛不上。可用 `tmux display -p '#{client_termfeatures}'` 確認清單裡有無 RGB。
set -as terminal-features ",alacritty*:RGB,xterm-256color:RGB"


# Claude Code 只要看到 $TMUX 就把自己降到 256 色，不管 COLORTERM 是什麼
# （versions/2.1.268 的 ae()：`if (env.TMUX && level > 2) level = 2`）。
# 降色之後它的 diff 底色會落在 256 色盤的固定索引上，主題自訂的 hex 全被壓掉。
# 這裡的外層終端確實吃 24-bit（client_termfeatures 有 RGB），所以關掉那個降級。
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1


# catppuccin plugin line (its options sit above `run tpm` — see the theme block).
# tokyo-night-tmux removed 2026-08-24 (replaced by catppuccin; rollback = git history).
set -g @plugin 'catppuccin/tmux#v2.3.0'


###########################
# claude integration      #
###########################

# Keep this the LAST line of the file. Everything Claude-related lives in
# claude.conf and is applied through run-shell on purpose: tokyo-night sets
# `pane-border-status off` from inside TPM's own run-shell, which executes
# after this file has finished parsing. Only a later run-shell wins.
# See claude.conf's header and tools/ARCHITECTURE.md for the whole design.
run-shell 'tmux source-file ~/.tmux/claude.conf'
