# tmux copy-mode 複製時送到系統剪貼簿
set -g set-clipboard on

# 加大 scrollback history
set -g history-limit 100000

# Prefix: Ctrl-b (tmux default).
# Press C-b twice to send a literal C-b to the inner program.
unbind C-a
set -g prefix C-b
bind C-b send-prefix

# prefix + C-t: enter copy mode (leave with q / Escape as usual).
bind C-t copy-mode


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'fcsonline/tmux-thumbs'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


###########################
# thumns config           #
###########################

# Linux ( wl-copy)
# copy tmux buffer to wl-copy buffer (system buffer of copy paste)
#(debian) sudo apt install wl-clipboard
set -g @thumbs-command 'echo -n {} | wl-copy && tmux set-buffer -- {}'

# Match file:line patterns like interview.vue:181
set -g @thumbs-regexp-1 '[[:alnum:]_./-]+\.[[:alnum:]]+:[0-9]+'





run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux




# tmux ace-window , fenrir design : emacs ace-window for tmux panes
# prefix + a : jump to a pane ; prefix + A : swap with a pane. Options + docs:
# ~/.tmux/plugins/tmux-ace-window/README.md
run-shell ~/.tmux/plugins/tmux-ace-window/ace-window.tmux


# 解決 Escape 鍵延遲（Evil 模式必看）：
# 如果你在 Emacs 裡使用 Vim 鍵盤布局（Evil-mode），你會發現按 Esc 退出插入模式時有明顯的延遲。這是因為 tmux 在等待判斷這是不是一個組合鍵。請在 .tmux.conf 中將延遲調
set -s escape-time 10

# 註：舊版用 `setw -g xterm-keys on` 解開 Shift/Ctrl + 方向鍵，但該選項在
# tmux 3.2 已移除，tmux 現在一律視同開啟，無需再設（移除於 2026-05-20）。


# default-terminal 設定的是 tmux 窗格「內部」回報的 TERM，與外層終端機無關，固定用 tmux-256color。
set -g default-terminal "tmux-256color"


# 啟用外層終端機的真色彩（24-bit RGB）支援。
# 冒號前是外層終端的 TERM：Alacritty 自帶 terminfo，TERM=alacritty（不是 xterm-256color）；
# 寫錯名稱會讓 RGB 掛不上。可用 `tmux display -p '#{client_termfeatures}'` 確認清單裡有無 RGB。
set -as terminal-features ",alacritty*:RGB,xterm-256color:RGB"


# tokyo night tmux
set -g @plugin "janoamaral/tokyo-night-tmux"


set -g @tokyo-night-tmux_transparent 1 # transparent background
set -g @tokyo-night-tmux_show_git 1             # local git status
set -g @tokyo-night-tmux_show_path 1            # current path
