# Claude-in-tmux integration — sourced from the LAST line of tmux.conf.
#
# Why a separate file sourced by `run-shell` instead of lines in tmux.conf:
# tokyo-night.tmux runs `set -g pane-border-status off` when TPM loads it, and
# plugin .tmux files execute in the run-shell queue — i.e. AFTER the whole
# config file has been parsed. Plain `set -g` lines in tmux.conf would be
# overwritten by the theme. Being queued behind TPM's own run-shell is what
# makes these settings win.
#
# Implementation: Rust binaries in tools/, one cargo workspace.
#   build with:  cd ~/.tmux/tools && cargo build --release
#   design doc:  tools/ARCHITECTURE.md
#   plans:       plans/*.md
#
# Binary paths are spelled out in full below. tmux config files are not shell:
# there is no reliable variable assignment to factor the common prefix into.

# ── Pane border: one format, six features ──────────────────────────────────
# tmux allows exactly ONE pane-border-format per window, so every badge shares
# this string. Priority left to right: inbox target, recording, role, then the
# Claude lifecycle beacon. Styles are written as separate #[..] directives
# because a comma inside #[fg=red,bold] would be read as a #{?:} separator.
set -g pane-border-status top
set -g pane-border-format '#{?pane_marked,#[fg=green]#[bold]▶ CLAUDE #[default],}#{?pane_pipe,#[fg=red]#[bold]●REC #[default],}#{?#{@claude_role},#[bold][#{@claude_role}]#[default] ,}#{?#{==:#{@claude_state},needs-input},#[fg=red]#[bold]✋ NEEDS INPUT#[default] #{@claude_task},#{?#{==:#{@claude_state},busy},#[fg=yellow]◐#[default] #{?#{@claude_activity},#{@claude_activity},#{@claude_task}},#{?#{==:#{@claude_state},idle},#[fg=green]●#[default] #{@claude_task},#{pane_index} #{pane_current_command}}}}'

# A border row costs a line of screen. Spend it only when it carries something:
# multi-pane windows always, single-pane windows only while marked or recording.
set-hook -g window-layout-changed 'set -wF pane-border-status "#{?#{==:#{window_panes},1},#{?#{||:#{pane_pipe},#{pane_marked}},top,off},top}"'

# ── Try-on t3 candidate 1 (tuned tokyo-night) — parked while candidate 2 is live
# set -g popup-style "fg=#c0caf5,bg=#1A1B26"
# set -g copy-mode-match-style "bg=#e0af68,fg=#1A1B26"
# set -g copy-mode-current-match-style "bg=#ff9e64,fg=#1A1B26"
# set -g copy-mode-mark-style "bg=#f7768e,fg=#1A1B26"
# set -g window-style "bg=#1A1B26"
# set -g window-active-style "bg=#1A1B26"

# ── Try-on t3 candidate 2 (catppuccin, PICKED): status composition ──────────
# catppuccin writes no status-left/right; compose from its module vars.
# MUST stay before the cc-beacon install-bar line: status-right is a cached
# key, install-bar must cache the post-composition value.
set -g status-right ""
set -agF status-right "#{E:@catppuccin_status_directory}"
set -g status-left ""
set -agF status-left "#{E:@catppuccin_status_session}"

# ── Status bar: fleet roster ───────────────────────────────────────────────
# Appends the beacon glyphs to whatever the theme set, idempotently — it caches
# the theme's own formats in @claude_bar_base_* on first run and always
# recomputes from that cache, so reloading this file never double-appends.
# After changing themes: `tmux set -gu @claude_bar_base_wsf` then reload.
run-shell -b "~/.tmux/tools/target/release/cc-beacon install-bar"

# ── Bell: a blocked agent in a hidden window raises the native '!' flag ─────
# cc-beacon writes BEL to the pane tty on the Notification hook, but only when
# the pane is off-screen. These are already the server defaults here; pinned so
# a fresh machine behaves the same.
set -g monitor-bell on
set -g visual-bell off
set -g bell-action any

# ── Attention jump ─────────────────────────────────────────────────────────
# N: go to the pane that most needs you — oldest blocked first, else the most
#    recently finished. Marks where you came from.
# B: bounce back. The mark is swapped each time, so B toggles.
bind N run-shell "~/.tmux/tools/target/release/cc-attend jump '#{client_name}' '#{pane_id}'"
bind B run-shell "~/.tmux/tools/target/release/cc-attend back '#{client_name}' '#{pane_id}'"

# ── Fleet picker ───────────────────────────────────────────────────────────
# S: fzf over every Claude pane in every session, with a live capture-pane
#    preview. Enter jumps; Esc closes with no side effects (the peek case).
bind S display-popup -E -w 90% -h 70% "~/.tmux/tools/target/release/cc-fleet"

# ── Launch menu ────────────────────────────────────────────────────────────
# C: every way a Claude session starts, one keystroke. This overrides tmux
#    3.5's default `customize-mode`, still reachable via `: customize-mode`.
bind C display-menu -T "#[align=centre]Claude" -x C -y C \
  "Split right"       s { split-window -h -c "#{pane_current_path}" "claude" } \
  "New window"        w { new-window -c "#{pane_current_path}" -n "cc:#{b:pane_current_path}" "claude" } \
  "Popup (throwaway)" p { display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "claude" } \
  "" \
  "Continue here"     c { send-keys "claude --continue" Enter } \
  "Resume picker"     r { display-popup -w 90% -h 70% -E "~/.tmux/tools/target/release/cc-launch resume '#{pane_id}' '#{q:pane_current_path}'" } \
  "" \
  "Project picker"    j { display-popup -w 80% -h 60% -E "~/.tmux/tools/target/release/cc-launch project" } \
  "Pair-spawn"        P { run-shell -b "~/.tmux/tools/target/release/cc-launch pair '#{pane_id}' '#{q:pane_current_path}'" }

# ── Capture rail: get evidence INTO a Claude composer, never submitted ──────
# The inbox is tmux's own marked pane: `prefix m` marks, `prefix M` clears, and
# the border shows ▶ CLAUDE so the current target is always visible.
# e: capture this pane's failing tail to a file, type an @-ref to the inbox.
# Y: send the copy-mode selection as ONE bracketed paste.
bind e run-shell "~/.tmux/tools/target/release/to-claude capture '#{pane_id}'"
bind -T copy-mode    Y send-keys -X copy-pipe-and-cancel "~/.tmux/tools/target/release/to-claude --paste"
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "~/.tmux/tools/target/release/to-claude --paste"

# ── Pane tape: flight recorder past the alt-screen ─────────────────────────
# T: toggle raw recording of this pane (●REC in the border).
# W: live ticker of the active pane's Claude tool calls — the semantic tape,
#    written automatically by cc-beacon's PostToolUse hook for every session.
bind T run-shell "~/.tmux/tools/target/release/cc-tape toggle '#{pane_id}'"
bind W display-popup -w 80% -h 60% -E "tail -n 200 -f /tmp/claude-progress/'#{pane_id}'.log 2>/dev/null || echo 'no ticker for #{pane_id} — not a Claude pane?'"

# ── Layout snapshot ────────────────────────────────────────────────────────
# M-s: record every session/window/pane, its cwd and its Claude session UUID.
# Restore after a reboot with: ~/.tmux/tools/target/release/cc-layout restore
bind M-s run-shell "~/.tmux/tools/target/release/cc-layout snapshot"

# ── Scrollback → Emacs ─────────────────────────────────────────────────────
# E: capture this pane's ENTIRE scrollback (history-limit 100000) to
#    /tmp/claude-capture/scrollback-<ts>-<pane>.txt and open it in the Emacs
#    daemon — reusing an existing frame, else a new "emacs" tmux window.
#    Overrides tmux's builtin spread-layout, still reachable via
#    `: select-layout -E` (same precedent as prefix C over customize-mode).
bind E run-shell "~/.tmux/tools/target/release/to-emacs '#{pane_id}'"

# ── seek: copy-mode jump-and-grab (replaced tmux-thumbs on prefix Space) ───
# Space: enter copy-mode and open tmux's own incremental search. Then in
# copy-mode: w/l grab the token / logical line under the cursor into
# wl-copy + the tmux buffer; W/L additionally send to the marked Claude pane.
# The pane STAYS in copy-mode after every grab — that is what makes the keys
# repeatable, and it is deliberate divergence from the copy-pipe-and-cancel
# style above (see the map's "Delivery and copy-mode").
#
# Spec: records/2026-08-09-1116-tmux-seek/tmux-seek.org, "Current contract".
# Runbook (install/verify/troubleshoot/rollback): runbooks/seek.md.
#
# The guard is LOAD-time: building the binary is not enough, the config must
# be re-sourced. The stub says so rather than failing silently.
if-shell '[ -x ~/.tmux/tools/target/release/seek ]' {

  # Two branches, NOT one `-p "#{?alternate_on,A,B}"` label: `-p` takes a
  # comma-separated LIST of prompts, so a conditional format containing commas
  # is read as three prompts. (man tmux; the map's t8 had this backwards.)
  #
  # `%%%` not `%%`: it escapes quotation marks in the response, which matters
  # because the response is substituted inside a quoted template argument.
  # The prompt opens EMPTY — stock C-r's `-I "#{pane_search_string}"` is
  # deliberately absent.
  bind -T prefix Space if-shell -F '#{alternate_on}' \
    'copy-mode ; command-prompt -i -T search -p "(seek ⚠ visible screen only)" "send-keys -X search-backward-incremental \"%%%\""' \
    'copy-mode ; command-prompt -i -T search -p "(seek)" "send-keys -X search-backward-incremental \"%%%\""'

  # The four output keys. copy-mode only (mode-keys is emacs, pinned in
  # tmux.conf). Each passes #{pane_id} explicitly: a copy-mode binding expands
  # its formats against the pane the key was pressed in, not the active pane.
  bind -T copy-mode w run-shell "~/.tmux/tools/target/release/seek word #{pane_id}"
  bind -T copy-mode W run-shell "~/.tmux/tools/target/release/seek word --claude #{pane_id}"
  bind -T copy-mode l run-shell "~/.tmux/tools/target/release/seek line #{pane_id}"
  bind -T copy-mode L run-shell "~/.tmux/tools/target/release/seek line --claude #{pane_id}"

} {

  # Unbuilt: one honest message instead of four dead keys.
  bind -T prefix Space display-message -l 'seek: not built — cd ~/.tmux/tools && cargo build --release && tmux source-file ~/.tmux/tmux.conf'

}

# ── regex search on prefix / (2026-08-22) ──────────────────────────────────
# Type a full regex, Enter, cursor lands on the match (searching backward
# through scrollback); n / N step next / previous (stock emacs copy-mode).
# seek's w/W/l/L grab keys chain from wherever the search lands.
# Non-incremental by necessity — measured on 3.5a: the -incremental search
# commands are plain-text only ('a.c' does not match abc), and re-running a
# regex search per keystroke would compound the cursor jumps. Space keeps the
# incremental plain-text entry above; this is its regex sibling.
# Overrides tmux's default `/` (describe-key prompt) — same precedent as
# prefix C over customize-mode; key help lives on prefix ? / M-? instead.
# Pure tmux, no binary — deliberately outside the seek guard.
bind -T prefix / if-shell -F '#{alternate_on}' \
  'copy-mode ; command-prompt -T search -p "(regex ⚠ visible screen only)" "send-keys -X search-backward \"%%%\""' \
  'copy-mode ; command-prompt -T search -p "(regex)" "send-keys -X search-backward \"%%%\""'
