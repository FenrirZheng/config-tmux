# seek — copy-mode jump-and-grab. Replaces tmux-thumbs on `prefix Space`.
#
# Destined for claude.conf, which tmux.conf sources last via a queued run-shell,
# so the load-time guard's existence check runs after every plugin. Ships inside
# the atomic cutover commit (T15) together with the thumbs removal.
#
# Specification: records/2026-08-09-1116-tmux-seek/tmux-seek.org, "Current contract".
# Verified to PARSE on tmux 3.5a (2026-08-09) by sourcing this file on a throwaway
# server and checking `list-keys`; both prompt labels verified to RENDER the same
# day via the tmux-in-tmux harness (scripts/verify-seek-live.sh).

# --- the guard -------------------------------------------------------------
# Load-time, so building the binary is not enough — the config must be
# re-sourced. The stub says so rather than failing silently.
if-shell '[ -x ~/.tmux/tools/target/release/seek ]' {

  # prefix Space: enter copy-mode and open tmux's own incremental search.
  #
  # Two branches, NOT one `-p "#{?alternate_on,A,B}"` label: `-p` takes a
  # comma-separated LIST of prompts, so a conditional format containing commas
  # is read as three prompts. (man tmux; the map's t8 had this backwards.)
  #
  # `%%%` not `%%`: it escapes quotation marks in the response, which matters
  # because the response is substituted inside a quoted template argument.
  # The prompt opens EMPTY — stock C-r's `-I "#{pane_search_string}"` is
  # deliberately absent.
  bind -T prefix Space if-shell -F '#{alternate_on}' \
    'copy-mode ; command-prompt -i -T search -p "(seek ⚠ visible screen only)" "send-keys -X search-backward-incremental \"%%%\""' \
    'copy-mode ; command-prompt -i -T search -p "(seek)" "send-keys -X search-backward-incremental \"%%%\""'

  # The four output keys. copy-mode only (mode-keys is emacs, pinned in
  # tmux.conf). Each passes #{pane_id} explicitly: a copy-mode binding expands
  # its formats against the pane the key was pressed in, not the active pane.
  bind -T copy-mode w run-shell "~/.tmux/tools/target/release/seek word #{pane_id}"
  bind -T copy-mode W run-shell "~/.tmux/tools/target/release/seek word --claude #{pane_id}"
  bind -T copy-mode l run-shell "~/.tmux/tools/target/release/seek line #{pane_id}"
  bind -T copy-mode L run-shell "~/.tmux/tools/target/release/seek line --claude #{pane_id}"

} {

  # Unbuilt: one honest message instead of four dead keys.
  bind -T prefix Space display-message -l 'seek: not built — cd ~/.tmux/tools && cargo build --release && tmux source-file ~/.tmux/tmux.conf'

}
