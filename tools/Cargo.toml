[workspace]
resolver = "2"
members = [
    "tmuxlib",
    "avy",
    "cc-beacon",
    "cc-attend",
    "cc-fleet",
    "cc-tape",
    "cc-layout",
    "cc-launch",
    "to-claude",
    "to-emacs",
    "talk-fleet",
    "seek",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
tmuxlib = { path = "tmuxlib" }
serde_json = "1"
# seek maps `copy_cursor_x` (a terminal *cell* column) onto a char index; a CJK
# character occupies two cells, so the mapping needs a real width table.
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
