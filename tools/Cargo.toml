[workspace]
resolver = "2"
members = [
    "tmuxlib",
    "cc-beacon",
    "cc-attend",
    "cc-fleet",
    "cc-tape",
    "cc-layout",
    "cc-launch",
    "to-claude",
    "to-emacs",
    "talk-fleet",
    "seek",
    "win-order",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.88: ratatui 0.30's own rust-version (was 1.75 before win-order).
rust-version = "1.88"

[workspace.dependencies]
tmuxlib = { path = "tmuxlib" }
serde_json = "1"
# seek maps `copy_cursor_x` (a terminal *cell* column) onto a char index; a CJK
# character occupies two cells, so the mapping needs a real width table.
unicode-width = "0.2"
# win-order's popup list and key loop (crossterm backend). Not 0.29: it pins
# unicode-width =0.2.0, which would drag seek's copy down from 0.2.2.
ratatui = "0.30"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
