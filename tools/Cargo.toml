[workspace]
resolver = "2"
members = [
    "tmuxlib",
    "cc-beacon",
    "cc-attend",
    "cc-fleet",
    "cc-tape",
    "cc-layout",
    "cc-launch",
    "to-claude",
    "to-emacs",
    "talk-fleet",
    "seek",
    "win-order",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
tmuxlib = { path = "tmuxlib" }
serde_json = "1"
# seek maps `copy_cursor_x` (a terminal *cell* column) onto a char index; a CJK
# character occupies two cells, so the mapping needs a real width table.
unicode-width = "0.2"
# win-order's popup list and key loop (crossterm backend). ratatui pins
# unicode-width =0.2.0 (0.30 too), which holds seek on 0.2.0 instead of 0.2.2;
# 0.30 also needs rust 1.88, above this workspace's rust-version.
ratatui = "0.29"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
